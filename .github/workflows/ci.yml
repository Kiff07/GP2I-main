name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        env:
            APP_ENV: test
            APP_SECRET: ci_secret_de_test
            DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
        steps:
            - uses: actions/checkout@v4

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_sqlite, intl
                  tools: composer

            - name: Installer les dépendances
              run: composer install --no-interaction --prefer-dist

            - name: Vérifier la syntaxe PHP
              run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

            - name: Vérifier les templates Twig
              run: php bin/console lint:twig templates/

            - name: Vérifier le conteneur Symfony
              run: php bin/console lint:container

            - name: Lancer les tests unitaires
              run: php bin/phpunit tests/Service tests/Entity
