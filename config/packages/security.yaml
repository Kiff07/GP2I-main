security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # L'entite Users devient la source des comptes (avant : users_in_memory vide,
    # donc AUCUNE authentification et tout le site etait public).
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email

    # Hierarchie : un admin peut tout faire, un gestionnaire gere le stock,
    # un utilisateur connecte consulte.
    role_hierarchy:
        ROLE_MANAGER: [ROLE_USER]
        ROLE_ADMIN: [ROLE_MANAGER, ROLE_USER]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
                # Anti force-brute : 5 essais max toutes les 15 minutes
                login_throttling:
                    max_attempts: 5
                    interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 semaine
                path: /
            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/users, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
